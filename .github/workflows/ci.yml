name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy cvnn scripts

      - name: Pytest
        run: uv run pytest

      - name: Verify activation characterization artifacts are in sync
        run: |
          uv run python scripts/characterize_activations.py --no-plots
          git diff --exit-code -- \
            notebooks/activation_characterization/comparison.md \
            notebooks/activation_characterization/comparison.json
