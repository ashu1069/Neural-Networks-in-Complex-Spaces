name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy cvnn scripts experiments

      - name: Pytest
        run: uv run pytest

      - name: Verify activation characterization summary regenerates
        run: |
          uv run python scripts/characterize_activations.py --no-plots
          # Structural sanity: all six activations are present in the table.
          # Numeric drift across BLAS implementations is expected and not
          # gated here; review the diff in PRs if it looks suspicious.
          for activation in crelu zrelu modrelu complex_cardioid siglog complex_tanh; do
            if ! grep -q "^| \`$activation\`" \
              notebooks/activation_characterization/comparison.md; then
              echo "Missing activation row: $activation"
              exit 1
            fi
          done

      - name: Reject committed manifests with dirty working tree
        run: |
          if git grep -l '"git_dirty": true' -- 'results/**/manifest.json'; then
            echo "Found committed manifest(s) recorded with git_dirty=true."
            echo "Re-run the benchmark from a clean working tree before committing."
            exit 1
          fi
