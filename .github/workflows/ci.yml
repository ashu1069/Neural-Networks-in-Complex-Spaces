name: CI

on:
  pull_request:
  push:
    branches: [main]

# Need full history so the dirty-manifest guard can diff vs the parent commit
# instead of scanning every committed manifest forever.

jobs:
  quality:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy cvnn scripts experiments

      - name: Pytest
        run: uv run pytest

      - name: Verify activation characterization summary regenerates
        run: |
          uv run python scripts/characterize_activations.py --no-plots
          # Structural sanity: all six activations are present in the table.
          # Numeric drift across BLAS implementations is expected and not
          # gated here; review the diff in PRs if it looks suspicious.
          for activation in crelu zrelu modrelu complex_cardioid siglog complex_tanh; do
            if ! grep -q "^| \`$activation\`" \
              notebooks/activation_characterization/comparison.md; then
              echo "Missing activation row: $activation"
              exit 1
            fi
          done

      - name: Warn on newly-added manifests with dirty working tree
        run: |
          # Resolve the comparison base: PR target branch on PRs, parent commit
          # on direct pushes. Fall back to HEAD~1 if neither applies.
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            base="origin/${GITHUB_BASE_REF}"
          elif [ -n "${GITHUB_EVENT_BEFORE:-}" ] && \
               git cat-file -e "${GITHUB_EVENT_BEFORE}^{commit}" 2>/dev/null; then
            base="${GITHUB_EVENT_BEFORE}"
          else
            base="HEAD~1"
          fi
          echo "Comparing against base: $base"

          # Surface manifests added/modified in this push that carry
          # git_dirty=true. We *warn* rather than fail because (a) the dirty
          # bit is preserved in the manifest itself for auditing, (b) blocking
          # CI on the GPU server's uncommitted-edit pattern has cost real
          # research time, and (c) the data is reproducible from the recorded
          # git_commit + dataset, just not bit-for-bit guaranteed.
          # TODO: replace with an explicit allowlist (e.g.
          # docs/dirty_manifests_accepted.md) that requires a per-entry
          # rationale and turns this back into a hard gate for un-allowlisted
          # manifests.
          changed_manifests=$(git diff --name-only --diff-filter=AM "$base"...HEAD \
            -- 'results/**/manifest.json')
          if [ -z "$changed_manifests" ]; then
            echo "No manifest changes in this push."
            exit 0
          fi
          violations=""
          for manifest in $changed_manifests; do
            if grep -q '"git_dirty": true' "$manifest"; then
              violations="$violations $manifest"
            fi
          done
          if [ -n "$violations" ]; then
            echo "::warning::Newly-added/modified manifest(s) recorded with git_dirty=true:"
            for manifest in $violations; do
              echo "::warning file=$manifest::recorded with git_dirty=true"
            done
            echo "Data is preserved; future runs from a clean tree should overwrite."
          fi
